<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Blytz Clothing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-panel">
    <a href="index.html" class="brand"><span class="brand-mark">V</span>Visualize</a>

    <h1>Welcome Back</h1>
    <p class="lede">Sign in to continue creating and managing your design mockups.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="password-field">
          <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="password-toggle" aria-label="Show password">Show</button>
        </div>
        <span class="field-error"></span>
      </div>

      <div class="field-row">
        <label class="checkbox-line">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#" class="link-accent">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html" class="link-accent">Register</a></p>
  </div>

  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=900&auto=format&fit=crop" alt="AI-generated clothing mockup example">
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
