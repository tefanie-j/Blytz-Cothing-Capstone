<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Account — Visualize</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-panel">
    <a href="index.html" class="brand"><span class="brand-mark">V</span>Visualize</a>

    <h1>Create Your Account</h1>
    <p class="lede">Start turning your clothing ideas into visual concepts.</p>

    <form id="register-form" class="auth-form" novalidate>
      <div class="field">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" name="name" placeholder="Your full name" autocomplete="name">
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="register-email">Email Address</label>
        <input type="email" id="register-email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="register-password">Password</label>
        <div class="password-field">
          <input type="password" id="register-password" name="password" placeholder="Create a password" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">Show</button>
        </div>
        <div class="strength-meter"><i></i><i></i><i></i><i></i></div>
        <span class="strength-label">Minimum 8 characters</span>
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="register-confirm">Confirm Password</label>
        <div class="password-field">
          <input type="password" id="register-confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">Show</button>
        </div>
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label class="checkbox-line">
          <input type="checkbox" id="register-terms" name="terms">
          I agree to the <a href="#" class="link-accent">Terms &amp; Conditions</a>
        </label>
        <span class="field-error"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html" class="link-accent">Login</a></p>
  </div>

  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=900&auto=format&fit=crop" alt="AI-generated clothing mockup example">
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
